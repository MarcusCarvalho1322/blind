    const MAGIC = 'BIZZIA_OK:';

    function unlock() {
      const pw = document.getElementById('pw').value;
      const err = document.getElementById('err');
      if (!pw) { err.textContent = 'Digite a senha.'; return; }
      try {
        const key = CryptoJS.PBKDF2(pw, CryptoJS.enc.Base64.parse(SALT), { keySize: 256 / 32, iterations: 100000 });
        const dec = CryptoJS.AES.decrypt(
          { ciphertext: CryptoJS.enc.Base64.parse(CIPHER) },
          key,
          { iv: CryptoJS.enc.Base64.parse(IV), mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
        );
        const plain = dec.toString(CryptoJS.enc.Utf8);
        if (plain.indexOf(MAGIC) === 0) {
          document.getElementById('login').style.display = 'none';
          const app = document.getElementById('app');
          app.innerHTML = plain.slice(MAGIC.length);
          app.style.display = 'block';
          drawCharts();
          document.getElementById('year').textContent = new Date().getFullYear();
          window.scrollTo(0, 0);
        } else {
          err.textContent = 'Senha incorreta.';
        }
      } catch (e) {
        err.textContent = 'Senha incorreta.';
      }
    }

    document.getElementById('pw').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') unlock();
    });

    function drawCharts() {
      // 1. Radar Chart: Score Bizz-Gold
      const ctxRadar = document.getElementById('radarChart').getContext('2d');
      new Chart(ctxRadar, {
        type: 'radar',
        data: {
          labels: [
            'Velocidade',
            'Qualificação (SPIN)',
            'Ancoragem de Valor',
            'Contorno de Objeções',
            'Condução ao Fecho',
            'Follow-up Estruturado'
          ],
          datasets: [{
            label: 'Desempenho Atual',
            data: [50, 0, 20, 0, 40, 60],
            backgroundColor: 'rgba(184, 115, 51, 0.2)',
            borderColor: '#B87333',
            pointBackgroundColor: '#D4A853',
            borderWidth: 2
          }, {
            label: 'Padrão Ouro bizz.ia',
            data: [90, 85, 90, 85, 95, 90],
            backgroundColor: 'transparent',
            borderColor: 'rgba(212, 168, 83, 0.4)',
            borderDash: [5, 5],
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            r: {
              angleLines: { color: 'rgba(255, 255, 255, 0.08)' },
              grid: { color: 'rgba(255, 255, 255, 0.05)' },
              pointLabels: { color: '#8E8D8A', font: { size: 10 } },
              ticks: { display: false, max: 100, min: 0 }
            }
          },
          plugins: {
            legend: {
              position: 'bottom',
              labels: { color: '#F0EDE8', font: { size: 10 } }
            }
          }
        }
      });

      // 2. Doughnut Chart: Funil de Triagem
      const ctxFunnel = document.getElementById('funnelChart').getContext('2d');
      new Chart(ctxFunnel, {
        type: 'doughnut',
        data: {
          labels: ['Oportunidades Comerciais Válidas', 'Ruído Operacional & Suporte', 'Spam / Fantasmas'],
          datasets: [{
            data: [38, 62, 15],
            backgroundColor: ['#D4A853', '#B87333', '#2A2A2A'],
            borderColor: '#000000',
            borderWidth: 3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { color: '#F0EDE8', font: { size: 10 } }
            }
          }
        }
      });
    }

    function copyToClipboard(button) {
      const scriptText = button.previousElementSibling.querySelector('.script-copy').innerText.trim().replace(/^[“"]|[”"]$/g, '');
      const done = () => {
        const originalContent = button.innerHTML;
        button.innerHTML = '<i class="fa-solid fa-check text-green-400"></i> Copiado!';
        button.classList.add('border-green-500/50', 'text-green-400');
        setTimeout(() => {
          button.innerHTML = originalContent;
          button.classList.remove('border-green-500/50', 'text-green-400');
        }, 2000);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(scriptText).then(done).catch(done);
      } else {
        done();
      }
    }
